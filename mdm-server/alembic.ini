# ──────────────────────────────────────────────────────────────
# Alembic Configuration — EduGuardian MDM Server
#
# QUAN TRỌNG: sqlalchemy.url bên dưới là placeholder.
# Giá trị thực được load từ .env qua alembic/env.py
# (settings.db_url từ app/core/config.py)
# ──────────────────────────────────────────────────────────────

[alembic]
# Vị trí thư mục chứa migration scripts
script_location = alembic


# Placeholder URL — bị override trong env.py bởi settings.db_url
# Driver phải là asyncpg vì toàn bộ project dùng async
sqlalchemy.url = postgresql+asyncpg://mdm_user:mdm_password@localhost:5434/mdm_db

# Tên file migration tự sinh — gồm timestamp + slug mô tả
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate slug dài thành 40 ký tự
truncate_slug_length = 40



# ──────────────────────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
