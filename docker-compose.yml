version: '3.9'

services:

  # ================================================================
  # PostgreSQL Database
  # ================================================================
  postgres:
    image: postgres:16-alpine
    container_name: mdm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mdm_db
      POSTGRES_USER: mdm_user
      POSTGRES_PASSWORD: mdm_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdm_user -d mdm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mdm-network

  # ================================================================
  # Redis - Cache & Message Broker
  # ================================================================
  redis:
    image: redis:7-alpine
    container_name: mdm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mdm-network

  # ================================================================
  # pgAdmin - Database Management UI (Dev only)
  # ================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mdm-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eduguardian.vn
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mdm-network
    profiles:
      - dev   # Chỉ chạy khi dùng: docker compose --profile dev up

  # ================================================================
  # Redis Commander - Redis Management UI (Dev only)
  # ================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: mdm-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mdm-network
    profiles:
      - dev   # Chỉ chạy khi dùng: docker compose --profile dev up

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  mdm-network:
    driver: bridge
