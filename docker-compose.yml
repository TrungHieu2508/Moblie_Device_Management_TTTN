version: '3.9'

services:

  # ================================================================
  # PostgreSQL Database
  # ================================================================
  postgres:
    image: postgres:16-alpine
    container_name: mdm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mdm_db
      POSTGRES_USER: mdm_user
      POSTGRES_PASSWORD: mdm_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mdm_user -d mdm_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mdm-network

  # ================================================================
  # pgAdmin - Database Management UI (Dev only)
  # ================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mdm-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eduguardian.vn
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mdm-network
    profiles:
      - dev # Chỉ chạy khi dùng: docker compose --profile dev up


volumes:
  postgres_data:
    driver: local

networks:
  mdm-network:
    driver: bridge
